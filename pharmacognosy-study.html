<title>Pharmacognosy 2 Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: left sidebar of drugs + one drug per view; mobile = sticky chip row. Botanical green, amber marks. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#13302C; --muted:#55696A; --line:#D5DEDA;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --soft:#E3EFEA; --mark:#9A6412; --markbg:#FFF1CC;
  --good:#1E7B45; --goodbg:#DDF1E4; --bad:#B3402F; --badbg:#F9E1DC;
  --font-d:'Space Grotesk','Inter',system-ui,sans-serif; --font-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1917; --surface:#15251F; --ink:#E6EFEC; --muted:#9BB0AB; --line:#27413A;
  --accent:#4FC3A1; --accent-ink:#07201A; --soft:#1B2F29; --mark:#F0B93A; --markbg:#3A2E0E;
  --good:#4CC27F; --goodbg:#143323; --bad:#F0806E; --badbg:#3B1D18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1917; --surface:#15251F; --ink:#E6EFEC; --muted:#9BB0AB; --line:#27413A;
  --accent:#4FC3A1; --accent-ink:#07201A; --soft:#1B2F29; --mark:#F0B93A; --markbg:#3A2E0E;
  --good:#4CC27F; --goodbg:#143323; --bad:#F0806E; --badbg:#3B1D18; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0;line-height:1.2}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-block:20px 64px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.brand{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand b{font-family:var(--font-d);font-size:20px}
.brand span{color:var(--muted);font-size:14px}
nav{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px}
nav .gl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
nav .gl:first-child{margin-top:0}
nav a{display:flex;align-items:center;gap:8px;text-decoration:none;padding:7px 10px;border-radius:8px;font-size:15px}
nav a:hover{background:var(--soft)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav a .ck{width:16px;color:var(--good);font-size:13px;flex:none}
nav a[aria-current="page"] .ck{color:var(--accent-ink)}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;background:var(--surface);padding:8px;margin-inline:-4px;border-bottom:1px solid var(--line);border-radius:0 0 12px 12px;white-space:nowrap}
  nav .gl{display:none}
  nav a{flex:none;border:1px solid var(--line);padding:6px 12px}
}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
@media(max-width:520px){.card{padding:16px}}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hd h1{font-size:clamp(30px,5vw,46px);margin-top:4px}
.hd .sci{font-style:italic;color:var(--muted);font-size:18px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--soft);border-radius:999px;padding:3px 12px;font-size:14px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:10px}
.fig{margin:0;min-width:0}
.fig svg{display:block;width:100%;height:auto;border-radius:12px}
.fig svg text{font-family:var(--font-b)}
.fig figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.pn{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.pn a{text-decoration:none;display:inline-block}
.plain{background:var(--soft);border-radius:12px;padding:16px 18px}
.plain .eyebrow{color:var(--accent)}
.plain p{margin:4px 0 0;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.facts div{min-width:0}
.facts dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0}
.sec h2{font-size:21px;margin-bottom:10px}
.sec ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.sec li{position:relative;padding-left:20px}
.sec li::before{content:"";position:absolute;left:3px;top:.7em;width:7px;height:7px;background:var(--accent);border-radius:2px}
.sec li.s{background:var(--markbg);border-radius:8px;padding:8px 12px 8px 30px}
.sec li.s::before{content:"\2605";background:none;color:var(--mark);width:auto;height:auto;left:10px;top:8px;font-size:13px;line-height:1.6}
.flowh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.flow{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center}
.flow span{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.flow i{font-style:normal;color:var(--accent);font-weight:700}
.tips{border:1.5px dashed var(--accent);background:transparent}
.tips h2{font-size:19px;margin-bottom:8px}
.tips ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tips .mn{margin-top:12px;font-size:15px;color:var(--muted)}
.qh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.qh h2{font-size:21px}
.qscore{font-size:14px;color:var(--muted)}
.q{padding-block:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q p{margin:0 0 10px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.ex{margin:10px 0 0;padding:10px 12px;background:var(--soft);border-radius:8px;font-size:15px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:hover{filter:brightness(1.07)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
td a{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.dc{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.dc:hover{border-color:var(--accent)}
.dc b{font-family:var(--font-d);font-size:18px}
.dc small{color:var(--muted);font-style:italic}
.dc em{font-style:normal;font-size:13px;color:var(--good)}
.hero h1{font-size:clamp(32px,6vw,54px)}
.hero p{max-width:60ch;font-size:18px;color:var(--muted);margin:10px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:16px}
.stats div b{font-family:var(--font-d);font-size:28px;display:block;line-height:1}
.stats div span{font-size:13px;color:var(--muted)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.big{font-family:var(--font-d);font-size:56px;line-height:1}
.wrongitem{padding-block:12px;border-top:1px solid var(--line)}
.wrongitem small{color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

{id:"liquorice",n:"Liquorice (Sweet Wood)",sci:"Glycyrrhiza glabra",fam:"Leguminosae (Fabaceae)",grp:"Roots",
sum:"A very sweet root. Glycyrrhizin is 50 times sweeter than sugar and heals ulcers, but it acts like aldosterone and can cause high blood pressure and low potassium.",
facts:[["Part used","Dried peeled or unpeeled root and rhizome"],["Varieties","var. typica = Spanish Liquorice; var. glandulifera = Russian Liquorice"],["Sources","Spain, France, England, Italy, Germany, USA, Southern Russia, Iran"],["Family","Leguminosae (Fabaceae)"]],
secs:[
{h:"Macroscopical characters",i:["Unpeeled root: dark-brown to reddish-brown outside, bright-yellow inside.","Faint characteristic odour and a very sweet taste."]},
{h:"Microscopical characters of the powder",i:["Powder colour: light-yellow if peeled, brownish-yellow if unpeeled.","Fibres with crystal sheath: thick lignified wall, narrow lumen, acute apex, surrounded by a sheath of crystals.","Xylem vessels showing bordered pits.","Prismatic crystals of calcium oxalate, free or inside cells.","Numerous starch granules, free or in parenchyma cells, some with a slit-like hilum.","Cork may be present: polygonal thin-walled cells with brown contents."]},
{h:"Active constituents",i:["Glycyrrhizin (5-7%): a triterpenoidal oleanane saponin-like glycoside. It is the sodium and calcium salt of glycyrrhizic acid and is 50 times as sweet as sugar.","Flavonoid glycosides: liquiritin, isoliquiritin, liquiritoside, rhamnoliquiritin, rhamnoisoliquiritin.","Coumarins: hermiarin and umbelliferone.","Free sugars (5-15%): glucose and sucrose, plus polysaccharides.","Bitter principle glycyramarin: abundant in the outer tissue, so it makes the unpeeled drug bitter.","Asparagine (amino acid), proteins, fat and starch (about 29%)."],
 fh:"What happens to glycyrrhizin on hydrolysis",f:["Glycyrrhizin (sweet)","hydrolysis","Glycyrrhetic acid (aglycone) + 2 glucuronic acid","Sweet taste is lost"]},
{h:"Tests for identity",i:["Powder + 1-2 drops of sulphuric acid (66% v/v) gives an orange-red colour.","Shaking the aqueous decoction gives a persistent froth (it contains saponins)."]},
{h:"Use 1: peptic and duodenal ulcers",i:["★ An extract containing glycyrrhizin healed ulcers well. The deglycyrrhizinized fraction (DGL) was slightly less effective, and glycyrrhizin alone had no effect.","★ Conclusion: the antiulcer effect is clearest when glycyrrhizin is combined with other compounds (synergism). Still, DGL is the form most commonly used, because it removes the glycyrrhizin that causes the blood pressure problems.","★ Mechanism: DGL strengthens the normal defence of the digestive mucosal lining rather than reducing acidity (unlike H2-antagonists).","★ DGL is as effective as H2-antagonists and antacids for healing ulcers, with fewer or no significant side effects.","★ DGL is strongly indicated for preventing gastric ulcers in people taking ulcerogenic drugs (aspirin, corticosteroids).","Dose: 380 mg chewable tablets, between meals or 20 minutes before meals, 2-4 times daily."]},
{h:"Use 2: mineralocorticoid-like action (the side effect)",i:["Glycyrrhetic acid has affinity for the kidney aldosterone receptors.","It also inhibits 5-β-reductase and 11-β-hydroxydehydrogenase, so cortisol and aldosterone accumulate and act for longer.","This gives pseudoaldosteronism: Na+ retention (hypernatremia), K+ loss (hypokalemia) and hypertension."],
 fh:"How liquorice raises blood pressure",f:["Glycyrrhetic acid","Inhibits 5-β-reductase and 11-β-HSD","Cortisol and aldosterone action is prolonged","Na+ and water retention, more blood volume; capillaries more sensitive to catecholamines","Severe hypertension"]},
{h:"Uses 3 to 7",i:["★ Anti-inflammatory (glycyrrhizin, glycyrrhetic acid, chalcones, flavonoids, especially in gastritis): inhibits prostaglandins and thromboxanes, like aspirin.","★ Anti-allergic (glycyrrhizin): inhibits histamine release from antigen-stimulated cells and intensifies the inhibitory action of dexamethasone.","Antiviral: glycyrrhizin irreversibly inactivates some viruses such as Herpes simplex, by interacting with sensitive virus proteins when they are made in host cells.","★ Liver: glycyrrhizin and its aglycone prevent cirrhosis (shown by preventing liver lesions in CCl4-poisoned rats). Glycyrrhizin + cysteine + glycine in normal saline improved liver function in hepatitis B and HIV.","Immunostimulant: induces interferons, which block viral DNA, activate macrophages and raise natural killer cell activity. Daily IV glycyrrhizin improves immune function."]},
{h:"Use 8: other uses",i:["Topical for allergic inflammation and dermatitis; eczema and psoriasis (topical glycyrrhetinic acid is similar to, and may be better than, hydrocortisone).","Rheumatoid arthritis and Addison's disease (adrenal hypofunction).","Demulcent and expectorant.","Flavouring agent that masks bitter drugs; flavour for gum, candy, tobacco, snuff, and foaminess in beer.","Glycyrrhetic acid hydrogen succinate (GAHS), as a disodium salt, for oral and orofacial herpes. At 1% GAHS the nasal absorption of insulin is greatly enhanced."]}
],
tips:["Sweet = glycyrrhizin. Bitter = glycyramarin.","High BP + high Na+ + low K+ = pseudoaldosteronism.","For ulcers use DGL, not glycyrrhizin.","Tests: H2SO4 gives orange-red; decoction gives persistent froth."],
mn:"Memory hook: Glycyr-RHIZ-in = sweet; Glycyr-AMA-rin = bitter (amara means bitter).",

["What causes hypertension with liquorice?","Pseudoaldosteronism: Na+ and water retention with K+ loss",["Lack of cortisol and aldosterone","Na+ excretion and K+ retention","Inhibition of prostaglandins"],"Glycyrrhetic acid prolongs cortisol and aldosterone action, so Na+ and water are retained."],
["What does the aqueous decoction of liquorice give when shaken?","A persistent froth",["An orange-red colour","A blue ring between layers","A rose-red colour"],"The froth shows saponins. The orange-red colour is the sulphuric acid test on the powder."]

{h:"Uses",i:["Expectorant in small doses (emetine > cephaeline).","Emetic in large doses (cephaeline > emetine).","Amoebic dysentery and amoebic hepatitis (emetine HCl by i.m. injection).","Diaphoretic (promotes sweating) and cholagogue (promotes bile flow)."]},

/* ---------- EXAM ---------- */
var ex=null;
function examStart(n){
  var all=[];D.forEach(function(d){d.qz.forEach(function(q){all.push({drug:d.n.split(" (")[0],q:q})})});
  var list=shuffle(all).slice(0,n);
  ex={list:list,i:0,right:0,wrong:[],answered:false,opts:opts(list[0].q[1],list[0].q[2])};
}
function examView(){
  if(!ex)return '<section class="card hd"><div class="eyebrow">Revision</div><h1>Final exam</h1><div class="sci">Questions from every drug, in random order</div></section><section class="card"><p style="margin-top:0">Pick a length. You see the answer and explanation after each question, and a review of your mistakes at the end.</p><div class="row"><button class="btn" data-act="exstart" data-n="20">20 questions</button><button class="btn ghost" data-act="exstart" data-n="'+TOTALQ+'">All '+TOTALQ+' questions</button></div></section>';
  if(ex.i>=ex.list.length){
    var pct=Math.round(ex.right/ex.list.length*100);
    var h='<section class="card hd"><div class="eyebrow">Result</div><div class="big">'+ex.right+' / '+ex.list.length+'</div><div class="sci">'+pct+'% correct. '+(pct>=85?'Excellent, you are ready.':pct>=60?'Good. Review the mistakes below.':'Go back over the drugs and try again.')+'</div><div class="row" style="margin-top:14px"><button class="btn" data-act="exstart" data-n="'+ex.list.length+'">Try again</button><button class="btn ghost" data-act="exreset">Change length</button></div></section>';
    if(ex.wrong.length){h+='<section class="card"><h2 style="font-size:20px;margin-bottom:6px">Review your mistakes</h2>'+ex.wrong.map(function(w){return '<div class="wrongitem"><small>'+w.drug+'</small><p style="margin:2px 0 6px;font-weight:600">'+w.q[0]+'</p><div>Correct answer: <b>'+w.q[1]+'</b></div><div style="color:var(--muted);font-size:15px">'+w.q[3]+'</div></div>'}).join("")+'</section>'}
    return h;
  }
  var cur=ex.list[ex.i];
  return '<section class="card"><div class="qh"><h2>Final exam</h2><span class="qscore">Question '+(ex.i+1)+' of '+ex.list.length+' · '+ex.right+' correct</span></div><div class="bar"><i style="width:'+(ex.i/ex.list.length*100)+'%"></i></div><div class="eyebrow">'+cur.drug+'</div><div class="q" style="border:0;padding-top:4px"><p>'+cur.q[0]+'</p><div class="opts">'+optBtns(ex.opts,"exopt","")+'</div><div class="ex" id="exex" hidden>'+cur.q[3]+'</div></div><div class="row"><button class="btn" id="exnext" data-act="exnext" hidden>'+(ex.i===ex.list.length-1?'See result':'Next question')+'</button></div></section>';
}

function render(){
  var id=(location.hash||"#home").slice(1);
  var v=document.getElementById("view");
  if(id==="home")v.innerHTML=homeView();
  else if(id==="compare")v.innerHTML=compareView();
  else if(id==="exam")v.innerHTML=examView();
  else if(byId(id))v.innerHTML=drugView2(byId(id));
  else{id="home";v.innerHTML=homeView()}
  renderNav(id);
}

/* ---------- EVENTS ---------- */
function updateQuizScore(did){
  var d=byId(did),qs=document.querySelectorAll(".q[data-qi]");
  var ans=0,right=0;qs.forEach(function(q){if(q.classList.contains("answered"))ans++;if(q.classList.contains("right"))right++});
  document.getElementById("qs").textContent=ans===d.qz.length?('Score: '+right+' of '+d.qz.length):(ans+' of '+d.qz.length+' answered');
  if(ans===d.qz.length){store.score[did]=right;save()}
}
function reveal(box,btn){
  box.querySelectorAll(".opt").forEach(function(b){b.disabled=true;if(b.getAttribute("data-ok")==="1")b.classList.add("ok")});
  if(btn.getAttribute("data-ok")!=="1")btn.classList.add("no");
}
document.getElementById("view").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act");
  if(act==="opt"){
    var q=b.closest(".q");if(q.classList.contains("answered"))return;
    q.classList.add("answered");if(b.getAttribute("data-ok")==="1")q.classList.add("right");
    reveal(q,b);q.querySelector(".ex").hidden=false;updateQuizScore(b.getAttribute("data-d"));
  }else if(act==="retry"){render()}
  else if(act==="done"){var did=b.getAttribute("data-d");if(b.checked)store.done[did]=true;else delete store.done[did];save();renderNav(did)}
  else if(act==="exstart"){examStart(parseInt(b.getAttribute("data-n"),10));render()}
  else if(act==="exreset"){ex=null;render()}
  else if(act==="exopt"){
    if(ex.answered)return;ex.answered=true;var cur=ex.list[ex.i];
    if(b.getAttribute("data-ok")==="1")ex.right++;else ex.wrong.push(cur);
    reveal(b.closest(".q"),b);document.getElementById("exex").hidden=false;document.getElementById("exnext").hidden=false;
  }else if(act==="exnext"){
    ex.i++;ex.answered=false;if(ex.i<ex.list.length){var n=ex.list[ex.i];ex.opts=opts(n.q[1],n.q[2])}
    render();window.scrollTo(0,0);
  }
});
render();
</script>
